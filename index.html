<script>
(function () {
  var wrap = document.getElementById('wrap');
  function fit() {
    var el = document.getElementById('stage');
    var s = Math.min(wrap.clientWidth / 1000, wrap.clientHeight / 1400);
    el.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
  document.getElementById('lai').addEventListener('click', function () {
    var el = document.getElementById('stage');
    var again = el.cloneNode(true);
    el.parentNode.replaceChild(again, el);
    fit();
  });
})();
</script>
